name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Run pytest
        run: uv run --group dev pytest tests

  build-macos:
    name: Build panoply binary (macOS arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build panoply binary
        run: bash scripts/build_panoply_binary.sh

  build-linux:
    name: Build panoply binary (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build panoply binary
        run: bash scripts/build_panoply_binary_linux.sh
