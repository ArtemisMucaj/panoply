name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Run pytest
        run: uv run --group dev pytest tests

  # Builds the same binaries the release workflow does, on the same runners, so
  # a PyInstaller break is caught on the PR instead of blocking a release.
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_script: scripts/build_panoply_binary_linux.sh
          - os: macos-14
            build_script: scripts/build_panoply_binary.sh
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build panoply binary
        run: bash ${{ matrix.build_script }}
      - name: Smoke-test the binary
        run: ./dist/panoply --help
