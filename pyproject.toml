[project]
name = "panoply"
version = "0.1.3"
description = "MCP proxy that aggregates multiple MCP servers behind 3 synthetic tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp[code-mode]>=4.0.0b3",
    "mcp>=2.0",
    "py-key-value-aio[disk]",
    "textual>=0.83",
    "truststore>=0.9",
    "zstandard>=0.23",
]

[project.scripts]
panoply = "panoply.__main__:_entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage[toml]>=7.15.4",
    # Reads openapi.yaml in tests/integration/test_openapi.py, which checks the
    # published contract still matches the routes the app actually serves.
    "pyyaml>=6.0",
]

[tool.uv]
# fastmcp 4.x is the first line that supports mcp 2.0; it is still in beta, so
# resolution has to be allowed to pick a pre-release for it.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panoply"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
