[project]
name = "panoply"
version = "0.1.0"
description = "MCP proxy that aggregates multiple MCP servers behind 3 synthetic tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.0",
    "fastmcp[code-mode]>=3.2.0",
    "mcp>=1.0",
    "py-key-value-aio[disk]",
    "textual>=0.83",
    "truststore>=0.9",
    "zstandard>=0.23",
]

[project.scripts]
panoply = "panoply.connector.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage[toml]>=7.0",
    # Reads openapi.yaml in tests/integration/test_openapi.py, which checks the
    # published contract still matches the routes the app actually serves.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panoply"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
