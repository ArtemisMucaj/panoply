[project]
name = "panoply"
version = "0.2.0"
description = "MCP proxy that aggregates multiple MCP servers behind 3 synthetic tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp[code-mode]",
    "mcp>=2.0",
    "py-key-value-aio[disk]",
    "textual>=0.83",
    "truststore>=0.9",
    "zstandard>=0.23",
]

[project.scripts]
panoply = "panoply.__main__:_entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "coverage[toml]>=7.15.4",
    # Reads openapi.yaml in tests/integration/test_openapi.py, which checks the
    # published contract still matches the routes the app actually serves.
    "pyyaml>=6.0",
]

[tool.uv.sources]
# fastmcp 4.x is the first line that supports mcp 2.0, and it is still in beta.
# Pinning the tag rather than depending on `fastmcp>=4.0.0b3` from PyPI keeps
# `prerelease = "allow"` out of this file: that setting is global, and a re-lock
# under it pulled pre-release pydantic and beartype in as well. A git source is
# exempt from the pre-release policy, so only fastmcp itself is pinned to a beta
# and the lock records the exact commit.
#
# Swap this back to a plain PyPI dependency once fastmcp 4.0.0 ships stable.
fastmcp = { git = "https://github.com/PrefectHQ/fastmcp", tag = "v4.0.0b3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panoply"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
